name: Build installers

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # required to create/upload GitHub Releases on tags

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # builds .dmg for darwin-arm64 + darwin-x64
            platform: mac
          - os: windows-latest # builds .exe (NSIS) for win32-x64
            platform: win

    steps:
      # Check out the app repo with the default GITHUB_TOKEN (it always has
      # read access to *this* repo). We do NOT use WORKER_REPO_TOKEN here: that
      # PAT is scoped to the separate worker repo and gets a 403 on this one.
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      # The worker lives in a separate (private) repo as a submodule. Fetch it
      # with WORKER_REPO_TOKEN, which has read access to that repo. We inject the
      # PAT via insteadOf so the exact pinned submodule commit (from .gitmodules)
      # is checked out. If the secret is empty the worker repo is assumed public.
      - name: Check out worker submodule
        shell: bash
        env:
          WORKER_REPO_TOKEN: ${{ secrets.WORKER_REPO_TOKEN }}
        run: |
          if [ -z "${WORKER_REPO_TOKEN}" ]; then
            echo "WORKER_REPO_TOKEN is empty — assuming the worker repo is public."
          else
            git config --global url."https://x-access-token:${WORKER_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          git submodule sync --recursive
          git submodule update --init --recursive
          echo "Worker submodule checked out:"
          ls -la electron/worker | head -n 20

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build renderer bundle
        run: npm run build:renderer

      - name: Build ${{ matrix.platform }} installer
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # No signing certs in CI -> skip macOS signing (produces an unsigned .dmg).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # On branch pushes (e.g. main): keep installers as downloadable artifacts (7 days).
      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: morari-translate-${{ matrix.platform }}
          path: |
            dist-build/*.dmg
            dist-build/*.exe
          retention-days: 7
          if-no-files-found: ignore

      # On version tags (v*): publish installers to the GitHub Release.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-build/*.dmg
            dist-build/*.exe
          fail_on_unmatched_files: false
