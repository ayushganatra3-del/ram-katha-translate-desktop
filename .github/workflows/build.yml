name: Build installers

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # required to create/upload GitHub Releases on tags

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # builds .dmg for darwin-arm64 + darwin-x64
            platform: mac
          - os: windows-latest # builds .exe (NSIS) for win32-x64
            platform: win

    steps:
      # Check out the app repo with the default GITHUB_TOKEN (it always has
      # read access to *this* repo). We do NOT use WORKER_REPO_TOKEN here: that
      # PAT is scoped to the separate worker repo and gets a 403 on this one.
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      # The worker is a separate PRIVATE repo (bundled at electron/worker, which
      # is a git submodule). The default GITHUB_TOKEN cannot read other repos, so
      # check it out with WORKER_REPO_TOKEN — a PAT that must have read (Contents)
      # access to ayushganatra3-del/morari-translate. Using actions/checkout here
      # (instead of `git submodule update`) handles the auth the canonical way.
      - name: Check out worker (private repo)
        uses: actions/checkout@v4
        with:
          repository: ayushganatra3-del/morari-translate
          ref: main
          token: ${{ secrets.WORKER_REPO_TOKEN }}
          path: electron/worker
          submodules: recursive
          persist-credentials: false

      - name: Verify worker checked out
        shell: bash
        run: |
          if [ ! -e electron/worker/package.json ]; then
            echo "::error::electron/worker is empty — worker checkout failed. Ensure WORKER_REPO_TOKEN has read access to ayushganatra3-del/morari-translate."
            ls -la electron/worker || true
            exit 1
          fi
          echo "Worker checked out:"
          ls -la electron/worker | head -n 20

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build renderer bundle
        run: npm run build:renderer

      - name: Build ${{ matrix.platform }} installer
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # No signing certs in CI -> skip macOS signing (produces an unsigned .dmg).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # On branch pushes (e.g. main): keep installers as downloadable artifacts (7 days).
      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: morari-translate-${{ matrix.platform }}
          path: |
            dist-build/*.dmg
            dist-build/*.exe
          retention-days: 7
          if-no-files-found: ignore

      # On version tags (v*): publish installers to the GitHub Release.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-build/*.dmg
            dist-build/*.exe
          fail_on_unmatched_files: false
