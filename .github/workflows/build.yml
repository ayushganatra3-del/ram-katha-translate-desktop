name: Build installers

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # required to create/upload GitHub Releases on tags

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # builds .dmg for darwin-arm64 + darwin-x64
            platform: mac
          - os: windows-latest # builds .exe (NSIS) for win32-x64
            platform: win

    steps:
      # The worker ships bundled at electron/worker (a git submodule pointing at
      # ayushganatra3-del/morari-translate). That repo is PUBLIC, so the default
      # GITHUB_TOKEN can read both this repo and the submodule — no PAT needed.
      - name: Checkout (with worker submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify worker checked out
        shell: bash
        run: |
          if [ ! -e electron/worker/package.json ]; then
            echo "::error::electron/worker is empty — submodule checkout failed. Ensure ayushganatra3-del/morari-translate is public (or readable by the build)."
            ls -la electron/worker || true
            exit 1
          fi
          echo "Worker checked out:"
          ls -la electron/worker | head -n 20

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build renderer bundle
        run: npm run build:renderer

      - name: Build ${{ matrix.platform }} installer
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # No signing certs in CI -> skip macOS signing (produces an unsigned .dmg).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # On branch pushes (e.g. main): keep installers as downloadable artifacts (7 days).
      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: morari-translate-${{ matrix.platform }}
          path: |
            dist-build/*.dmg
            dist-build/*.exe
          retention-days: 7
          if-no-files-found: ignore

      # On version tags (v*): publish installers to the GitHub Release.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-build/*.dmg
            dist-build/*.exe
          fail_on_unmatched_files: false
